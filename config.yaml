# ============================================================
# Configuration du serveur multimédia Magenta
# ============================================================

server:
  # Adresse IP d'écoute du serveur.
  # "0.0.0.0" = toutes les interfaces (développement uniquement).
  # En production, utiliser l'IP locale, ex: "192.168.1.10"
  host: "0.0.0.0"

  # Port TCP du serveur HTTP.
  port: 8080

  # Délai maximum pour lire une requête entrante (en secondes).
  read_timeout_sec: 30

  # Délai maximum pour écrire une réponse (en secondes).
  # 0 = pas de limite (recommandé pour le streaming de gros fichiers vidéo).
  write_timeout_sec: 0

media:
  # Racines autorisées pour la sécurité.
  # Seuls les répertoires sous ces racines peuvent être scannés.
  # Cette protection empêche l'exposition accidentelle de fichiers système.
  allowed_roots:
    - "D:/"

  # Liste des répertoires contenant les fichiers multimédias à exposer.
  # Utiliser des chemins absolus. Plusieurs dossiers sont supportés.
  # IMPORTANT : chaque chemin DOIT être sous l'une des racines autorisées ci-dessus.
  dirs:
    - "D:/Videos"
    # - "D:/Films"
    - "D:/Series"

  # Extensions de fichiers considérées comme des médias (sans le point).
  extensions:
    - "mp4"
    - "mkv"
    - "avi"
    - "mov"
    - "wmv"
    - "flv"
    - "webm"
    - "m4v"

log:
  # Niveau de verbosité des logs : debug | info | warn | error
  level: "info"

  # Format JSON des logs (true = production, false = texte lisible en développement)
  json: false

mdns:
  # Activation de la découverte réseau mDNS.
  # Permet d'accéder au serveur via http://magenta.local:8080
  enabled: true

  # Nom de l'instance sur le réseau local.
  # Le serveur sera accessible via http://<name>.local:<port>
  name: "magenta"
