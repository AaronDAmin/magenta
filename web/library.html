<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magenta</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ── Navbar ───────────────────────────────────────────── -->
  <nav class="navbar" id="navbar">
    <a href="/" class="navbar-brand">MAGENTA<span>.</span></a>
    <div class="navbar-right">
      <span class="navbar-user" id="navUser"></span>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </nav>

  <!-- ── Hero ─────────────────────────────────────────────── -->
  <div class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-vignette"></div>
    <div class="hero-content">
      <div class="hero-logo">MAGENTA<span>.</span></div>
      <p class="hero-tagline">Votre cinéma privé, accessible depuis n'importe quel appareil sur votre réseau.</p>
      <div class="hero-stats" id="heroStats">
        <div class="hero-stat">
          <div class="hero-stat-value" id="statTotal">—</div>
          <div class="hero-stat-label">Médias</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-value" id="statGroups">—</div>
          <div class="hero-stat-label">Séries / Films</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Contenu ───────────────────────────────────────────── -->
  <div class="library-content">

    <!-- Barre de recherche -->
    <div class="search-section">
      <div class="search-wrapper">
        <div class="search-input-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input class="search-input" id="searchInput" type="text" placeholder="Rechercher un film, une série...">
        </div>
        <span class="media-count" id="mediaCount"></span>
      </div>
    </div>

    <!-- Rows -->
    <div id="rows"></div>

    <!-- État vide -->
    <div class="empty-state" id="emptyState">
      <div class="empty-state-icon">🎬</div>
      <h2>Aucun résultat</h2>
      <p>Essaie un autre terme de recherche</p>
    </div>
  </div>

  <script>
    let allGroups = [];
    let searchTerm = '';

    // ── Token ─────────────────────────────────────────────────
    function getToken() {
      const m = document.cookie.match(/magenta_token=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    }

    function logout() {
      document.cookie = 'magenta_token=; path=/; max-age=-1';
      window.location.href = '/login';
    }

    // ── Navbar scroll effect ──────────────────────────────────
    window.addEventListener('scroll', () => {
      document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 80);
    });

    // ── Chargement initial ────────────────────────────────────
    async function load() {
      const token = getToken();
      if (!token) { window.location.href = '/login'; return; }

      // Afficher le nom d'utilisateur stocké
      const savedUser = sessionStorage.getItem('mg_username');
      if (savedUser) document.getElementById('navUser').textContent = savedUser;

      try {
        const res = await fetch('/api/folders', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) { logout(); return; }

        const data = await res.json();
        allGroups = data.groups || [];

        document.getElementById('statTotal').textContent  = data.total || 0;
        document.getElementById('statGroups').textContent = allGroups.length;
        document.getElementById('mediaCount').textContent =
          `${data.total || 0} médias · ${allGroups.length} groupes`;

        render();

      } catch (e) {
        console.error('Erreur chargement:', e);
      }
    }

    // ── Rendu des rows ────────────────────────────────────────
    function render() {
      const q = searchTerm.toLowerCase();
      const rows = document.getElementById('rows');
      const empty = document.getElementById('emptyState');

      const filtered = allGroups.map(g => ({
        ...g,
        items: g.items.filter(m =>
          m.name.toLowerCase().includes(q) ||
          g.name.toLowerCase().includes(q)
        )
      })).filter(g => g.items.length > 0);

      if (filtered.length === 0) {
        rows.innerHTML = '';
        empty.style.display = 'block';
        return;
      }

      empty.style.display = 'none';

      rows.innerHTML = filtered.map(g => `
        <div class="row">
          <div class="row-header" onclick="toggleRow(this)">
            <div class="row-title">
              <span class="row-title-icon">${g.items.length === 1 ? '🎬' : '📺'}</span>
              ${escHtml(g.name)}
              <span class="row-count">${g.items.length}</span>
            </div>
            <span class="row-arrow">▼</span>
          </div>
          <div class="cards-grid" style="max-height: 2000px;">
            ${g.items.map(m => cardHTML(m)).join('')}
          </div>
        </div>
      `).join('');

      // Clic sur la card entière → lecteur web
      rows.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => {
          if (!card.dataset.id) return;
          window.location.href = `/player?id=${card.dataset.id}`;
        });
      });
    }

    // ── Card HTML ─────────────────────────────────────────────
    function cardHTML(m) {
      const token = getToken();
      const enc   = encodeURIComponent(token);
      return `
        <div class="card" data-id="${m.id}">
          <div class="card-thumb">
            <span class="card-thumb-icon">🎬</span>
            <span class="card-ext">${m.extension}</span>
            <div class="card-overlay">
              <button class="card-btn" title="Lire"
                onclick="event.stopPropagation(); play('${m.id}')">▶</button>
              <button class="card-btn btn-vlc" title="Ouvrir dans VLC"
                onclick="event.stopPropagation(); openVLC('${m.id}', '${enc}')">📺</button>
            </div>
          </div>
          <div class="card-info">
            <div class="card-name" title="${escHtml(m.name)}">${escHtml(m.name)}</div>
            <div class="card-meta">${formatSize(m.size)}</div>
          </div>
        </div>
      `;
    }

    function play(id) {
      window.location.href = `/player?id=${id}`;
    }

    function openVLC(id, encodedToken) {
      if (/Android/i.test(navigator.userAgent)) {
        openVLCAndroid(id, encodedToken);
      } else {
        // PC / Mac / iOS : fichier .m3u → association système vers VLC
        window.location = `/stream/${id}/vlc?token=${encodedToken}`;
      }
    }

    // ── VLC Android ───────────────────────────────────────────
    // Format intent correct pour VLC Android installé depuis le Play Store.
    // Référence : https://wiki.videolan.org/Android_Player_Intents/
    //
    // Structure :
    //   intent://<host>/<path>?<query>#Intent;scheme=http;package=org.videolan.vlc;
    //                                  action=android.intent.action.VIEW;end
    //
    // Le fallback S.browser_fallback_url est requis pour que Chrome ne bloque
    // pas l'intent sur les pages HTTP (comportement Chrome 83+).
    function openVLCAndroid(id, encodedToken) {
      const host     = location.host;
      const path     = `stream/${id}`;
      const query    = `token=${encodedToken}`;
      const fallback = encodeURIComponent(`${location.origin}/stream/${id}/vlc?token=${encodedToken}`);

      const intentURL =
        `intent://${host}/${path}?${query}` +
        `#Intent;` +
        `scheme=http;` +
        `package=org.videolan.vlc;` +
        `action=android.intent.action.VIEW;` +
        `S.browser_fallback_url=${fallback};` +
        `end`;

      window.location = intentURL;
    }

    // ── Toggle collapse row ───────────────────────────────────
    function toggleRow(header) {
      const grid   = header.nextElementSibling;
      const arrow  = header.querySelector('.row-arrow');
      const isOpen = grid.style.maxHeight !== '0px';

      grid.style.maxHeight   = isOpen ? '0px' : '2000px';
      grid.style.overflow    = isOpen ? 'hidden' : 'visible';
      grid.style.opacity     = isOpen ? '0' : '1';
      arrow.style.transform  = isOpen ? 'rotate(-90deg)' : 'rotate(0)';
    }

    // ── Recherche debounce ────────────────────────────────────
    let debounce;
    document.getElementById('searchInput').addEventListener('input', e => {
      clearTimeout(debounce);
      debounce = setTimeout(() => { searchTerm = e.target.value; render(); }, 200);
    });

    // ── Helpers ───────────────────────────────────────────────
    function formatSize(bytes) {
      if (!bytes) return '';
      if (bytes < 1048576)      return (bytes / 1024).toFixed(0) + ' KB';
      if (bytes < 1073741824)   return (bytes / 1048576).toFixed(1) + ' MB';
      return (bytes / 1073741824).toFixed(2) + ' GB';
    }

    function escHtml(s) {
      return s
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    // ── Init ──────────────────────────────────────────────────
    load();
  </script>
</body>
</html>
